
name: Probar FutbolAragon en Android

on:
  push:
    branches:
      - feature/supabase

permissions:
  contents: read

jobs:
  probar-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Habilitar aceleracion KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Iniciar Android con Google Play
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          script: |
            echo "=== DISPOSITIVOS ==="
            adb devices

            echo "=== GOOGLE PLAY ==="
            adb shell pm list packages com.android.vending

            echo "=== FUTBOLARAGON ==="
            adb shell pm list packages com.novanet.FutbolAragonAppPublica

            echo "=== ABRIENDO FICHA EN GOOGLE PLAY ==="
            adb shell am start -a android.intent.action.VIEW \
              -d "market://details?id=com.novanet.FutbolAragonAppPublica" \
              -p com.android.vending
            sleep 8

            echo "=== CAPTURA DE PANTALLA ==="
            adb exec-out screencap -p > pantalla_playstore.png

      - name: Guardar captura de Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pantalla-playstore
          path: pantalla_playstore.png
          if-no-files-found: warn
