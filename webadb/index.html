<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{font-family:system-ui,Segoe UI,sans-serif;color-scheme:dark;color:#eee}*{box-sizing:border-box}body{margin:0;padding:2px;background:transparent}
button{background:#ff4b4b;border:0;border-radius:8px;color:white;font-weight:650;padding:11px 16px;cursor:pointer}button:disabled{opacity:.5}.status{margin:10px 0;font-size:14px}.detail{color:#bdc5d1;font-size:13px;margin:6px 0}pre{margin:10px 0 0;padding:12px;border:1px solid #38404a;border-radius:8px;background:#151920;color:#e5e7eb;font-size:12px;line-height:1.5;white-space:pre-wrap;overflow:auto;height:220px;overflow-wrap:anywhere}
#status{font-weight:700;padding:3px 8px;border-radius:6px;display:inline-block}
#status.state-error{color:#ff6b6b;background:rgba(255,75,75,.13)}
#status.state-paused{color:#ffd166;background:rgba(255,193,7,.14)}
#status.state-success{color:#65d6a6;background:rgba(0,200,120,.12)}
#status.state-active{color:#7dc4ff;background:rgba(60,153,255,.13)}
#status.state-idle{color:#c7cbd3}
#usb-overlay[hidden]{display:none}#usb-overlay{position:fixed;inset:0;background:rgba(12,17,25,.94);z-index:30;display:flex;align-items:center;justify-content:center;padding:14px}#usb-card{background:#202632;border:1px solid #d7a74d;border-radius:16px;max-width:620px;width:100%;padding:22px;text-align:center;box-shadow:0 15px 40px #0009}#usb-card h2{color:#ffd166;margin:8px 0}#usb-card p{line-height:1.5;color:#e8e8e8}
</style></head><body>
<button id="action">▶ Actualizar jugadores</button><div class="status"><strong>Estado:</strong> <span id="status">Preparado</span></div><div class="detail" id="device">Conecta el móvil por USB y abre la app RFAF.</div><pre id="log">Consola preparada.</pre>
<div id="usb-overlay" hidden role="alertdialog" aria-label="Móvil desconectado"><section id="usb-card"><div style="font-size:38px">🔌</div><h2>Móvil desconectado</h2><p>Actualización pausada. Conecta el móvil por USB y abre la app RFAF.</p><p>Los jugadores guardados se conservan.</p><button id="usb-retry">Reconectar móvil</button></section></div>
<script type="module" src="./main.js"></script></body></html>
